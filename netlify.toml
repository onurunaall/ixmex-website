# netlify.toml
[build]
  publish = "."

[[redirects]]
  from   = "http://*"
  to     = "https://:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/api*"
  to = "/swiper-api"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://maps.googleapis.com; frame-src 'self' https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' https://cdn.jsdelivr.net;"
