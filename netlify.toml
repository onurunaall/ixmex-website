# netlify.toml

[build]
  # Publish the root folder (your HTML / assets live here)
  publish = "."

# ───────────────────────────
# Redirects
# ───────────────────────────
[[redirects]]
  from   = "http://*"
  to     = "https://:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/api*"
  to   = "/swiper-api"
  status = 301

# ───────────────────────────
# Build-time asset processing
# ───────────────────────────
[build.processing.js]
  bundle = false
  minify = false

[build.processing.css]
  bundle = false
  minify = false

# ───────────────────────────
# Security + perf headers
# ───────────────────────────

# 1) Global headers (all routes)
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy             = "strict-origin-when-cross-origin"
    X-Frame-Options             = "SAMEORIGIN"
    X-Content-Type-Options      = "nosniff"
    Permissions-Policy          = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy     = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: blob: https://maps.googleapis.com; frame-src 'self' https://www.google.com; connect-src 'self'; object-src 'none'; base-uri 'self';"

# 2) Long cache for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"  # 30 days
