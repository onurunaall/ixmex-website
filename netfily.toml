# ──────────────────────────────────────────────
# netfily.toml   (project-root)
# ──────────────────────────────────────────────

[build]
  # Publish the root folder (your HTML / assets live here)
  publish = "."

# ───────────────────────────
# Redirects (unchanged)
# ───────────────────────────
[[redirects]]
  from   = "http://*"
  to     = "https://:splat"
  status = 301
  force  = true

[[redirects]]
  from = "/api*"
  to   = "/swiper-api"
  status = 301

# ───────────────────────────
# Build-time asset processing
# ───────────────────────────
[build.processing.js]
  bundle = false
  minify = false

[build.processing.css]
  bundle = false
  minify = false

# ───────────────────────────
# **Security + perf headers**
# ───────────────────────────
# 1) Global headers (all routes)
[[headers]]
  for = "/*"
  [headers.values]
    # tighten XSS / click-jacking etc.
    Referrer-Policy       = "strict-origin-when-cross-origin"
    X-Frame-Options       = "SAMEORIGIN"
    X-Content-Type-Options= "nosniff"
    Permissions-Policy    = "camera=(), microphone=(), geolocation=()"

    # ░░░ Content-Security-Policy ░░░
    # – Allows Bootstrap-Icons font (cdn.jsdelivr.net)
    # – Allows Swiper + SimpleLightbox JS (cdn.jsdelivr + cdnjs)
    # – Blocks everything else by default.
    Content-Security-Policy = """
      default-src 'self';
      script-src  'self'
                  https://cdn.jsdelivr.net
                  https://cdnjs.cloudflare.com;
      style-src   'self' 'unsafe-inline'
                  https://fonts.googleapis.com
                  https://cdn.jsdelivr.net
                  https://cdnjs.cloudflare.com;
      font-src    'self' data:
                  https://fonts.gstatic.com
                  https://cdn.jsdelivr.net;
      img-src     'self' data: blob:
                  https://maps.googleapis.com;
      frame-src   'self' https://www.google.com;
      connect-src 'self';
      object-src  'none';
      base-uri    'self';
    """

# 2) Give **static assets** a long immutable cache
#    (faster repeat visits, especially on mobile)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"  # 30 days
